name: CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, ESLint, Security Scan, Unit, Integration & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fast Syntax Verification
        run: npm run syntax-check

      - name: ESLint Static Code Analysis
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Production ESBuild Pipeline
        run: npm run build

      - name: Run Unit, Integration & Security Tests with Coverage
        run: npm run test:coverage

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Run Production Smoke Test Suite
        run: npm run test:prod

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
